<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAD BEYOND — phone preview (not for deploy)</title>
<style>
  body { margin: 0; background: #1b1f24; color: #cfd8e0; font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid #3a4550;
           background: #232a31; color: #cfd8e0; cursor: pointer; }
  button[aria-pressed="true"] { background: #74d0f0; color: #0a3d52; border-color: #74d0f0; font-weight: 600; }
  .note { opacity: .65; margin-inline-start: auto; }
  .stage { display: flex; justify-content: center; padding: 0 16px 24px; }
  iframe { width: 390px; height: 780px; border: 0; border-radius: 20px; background: #fff;
           box-shadow: 0 18px 50px rgba(0,0,0,.5); }
</style>
</head>
<body>
<header>
  <span>Width:</span>
  <button data-w="360" type="button">360</button>
  <button data-w="390" type="button" aria-pressed="true">390 (iPhone)</button>
  <button data-w="430" type="button">430</button>
  <button data-w="600" type="button">600</button>
  <button data-w="820" type="button">820</button>
  <span class="note">Local preview only — delete both preview-local*.html before deploying.</span>
</header>
<div class="stage"><iframe id="frame" src="preview-local.html" title="preview"></iframe></div>
<script>
  var frame = document.getElementById('frame');
  document.querySelectorAll('button[data-w]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('button[data-w]').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      frame.style.width = b.dataset.w + 'px';
    });
  });
</script>
</body>
</html>
